name: recon-19621b
on:
  push:
    branches: ["recon19621b-*"]
permissions:
  contents: write
jobs:
  vm:
    runs-on: [self-hosted, wine]
    timeout-minutes: 15
    steps:
      - name: read-only L1 validator-set control plane recon (round2)
        shell: bash
        run: |
          set +e
          cd "$(mktemp -d)" || exit 1
          echo "" | base64 -d > batch.json
          echo "" | base64 -d > meta.json
          cat > r.py <<'PYEOF'
          #!/usr/bin/env python3
          import json, base64, gzip, urllib.request, urllib.error

          EX="http://65.108.205.116:9650"
          SN="B5gLCyeRWScxf1CeGHfXjEkcp5au8dQYQjtSV6cRammsLjsbK"
          SUBNET="27dmQbsGrm4xo9VfrxNSewccy3kZ6N49MuSNJhsdhKkMaTZcYv"
          RPC=f"{EX}/ext/bc/{SN}/rpc"
          OUT={}

          def post(url, payload, timeout=90):
              b=json.dumps(payload).encode()
              r=urllib.request.Request(url, data=b, headers={"Content-Type":"application/json","User-Agent":"OmniBazaar-recon-19621"})
              try:
                  with urllib.request.urlopen(r, timeout=timeout) as resp:
                      return resp.status, json.loads(resp.read().decode() or "{}")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:400]
              except Exception as e:
                  return -1, repr(e)[:300]

          META=json.load(open("meta.json"))
          BATCH=json.load(open("batch.json"))

          st, resp = post(RPC, BATCH, 180)
          OUT["batch_http"]=st
          if isinstance(resp, dict) and isinstance(resp.get("result"), list):
              for item in resp["result"]:
                  i=str(item.get("id")); lab=META.get(i,{}).get("label",i)
                  OUT[lab]= item.get("error") if "error" in item else item.get("result")
          else:
              OUT["batch_raw"]=resp

          for lab,m,p in [
           ("pcv_subnet","platform.getCurrentValidators",[{"subnetID":SUBNET}]),
           ("pcv_all","platform.getCurrentValidators",[]),
           ("ppv_subnet","platform.getPendingValidators",[{"subnetID":SUBNET}]),
           ("getSubnet","platform.getSubnet",[{"subnetID":SUBNET}]),
           ("bc_status","platform.getBlockchainStatus",[{"blockchainID":SN}]),
          ]:
              s,r=post(f"{EX}/ext/bc/P", {"jsonrpc":"2.0","id":1,"method":m,"params":p}, 90)
              OUT[lab]={"http":s,"resp":r}

          for lab,m in [("nodeID","info.getNodeID"),("nodeIP","info.getNodeIP"),("networkID","info.getNetworkID")]:
              s,r=post(f"{EX}/ext/info", {"jsonrpc":"2.0","id":1,"method":m,"params":[]}, 30)
              OUT[lab]={"http":s,"resp":r}

          blob=json.dumps(OUT).encode()
          gz=gzip.compress(blob)
          b64=base64.b64encode(gz).decode()
          print("##RESULT gzip_b64 bytes=%d raw=%d" % (len(b64), len(blob)))
          for i in range(0, len(b64), 30000):
              print(b64[i:i+30000])
          print("##DONE")

          PYEOF
          python3 r.py

      - name: cleanup temp branch (self-delete)
        if: always()
        shell: bash
        env:
          TOK: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          git push "https://x-access-token:${TOK}@github.com/${GITHUB_REPOSITORY}.git" --delete "${GITHUB_REF_NAME}" 2>&1 || echo "cleanup-failed"
