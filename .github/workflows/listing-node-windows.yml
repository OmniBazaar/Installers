# Build the Windows listing-node installer from source, and sign it with Certum.
#
# Why this workflow exists: a signature is only worth something if the binary it covers
# can be traced to a reviewable build. Building by hand and signing afterwards proves
# nothing about the source, so the whole path — stage, compile, sign, verify, hash —
# runs here, in one approved job.
#
# Three properties to keep:
#
# 1. **Inputs are pinned by URL *and* SHA-256**, in `listing-node-windows/tools.lock.json`
#    and below (ssign). A silently changed upstream artifact fails the build instead of
#    changing what we ship.
# 2. **Signing is gated by a human.** The job declares `environment: signing`, whose
#    required-reviewer rule must be clicked before the certificate credentials are even
#    readable. A pull request cannot trigger a signature.
# 3. **Sign before hashing.** Authenticode changes the bytes; a hash recorded before
#    signing describes a file nobody downloads. The hash printed at the end is of the
#    signed installer, and that is what the release record and the chain must carry.
#
# The signer is `ssign` (MIT, https://github.com/Le-Syl21/ssign): it talks to the Certum
# SimplySign cloud directly, so a Linux runner can sign a Windows PE without SimplySign
# Desktop, a GUI, or a PKCS#11 stack. The uninstaller is signed too, through NSIS's
# `!uninstfinalize`, otherwise an operator meets "Unknown publisher" when they uninstall.

name: Listing node — Windows installer

on:
  push:
    tags:
      - "listing-node-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Base version, e.g. 1.0.14 (no leading v)"
        required: true
      sign:
        description: "Sign with the Certum certificate (requires the signing environment)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    # Required-reviewer rule on this environment is the approval step: no signature
    # without a team member clicking it. Secrets live on the environment, not the repo.
    environment: signing
    steps:
      - name: Checkout Installers
        uses: actions/checkout@v4
        with:
          path: Installers

      # The Validator is a workspace member: it cannot `npm install` on its own. This
      # composite action is the same one the release pipeline uses, so a build here and
      # a build there produce the same `dist/`.
      - name: Reconstruct the build workspace (Validator + WebApp + packages)
        uses: ./Installers/.github/actions/reconstruct-workspace
        with:
          token: ${{ secrets.OBZ_CHECKOUT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install NSIS and the signature verifier
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nsis osslsigncode

      # ── Third-party build inputs, verified against the pinned recipe ─────────────
      - name: Download and verify the pinned Windows inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/win-inputs"
          node -e '
            const fs = require("fs");
            const lock = JSON.parse(fs.readFileSync("Installers/listing-node-windows/tools.lock.json", "utf8"));
            console.log(lock.node.url);
            console.log(lock.node.sha256);
            console.log(lock.postgresql.url);
            console.log(lock.postgresql.sha256);
          ' > "$RUNNER_TEMP/pins.txt"
          mapfile -t PINS < "$RUNNER_TEMP/pins.txt"
          curl -fsSL -o "$RUNNER_TEMP/win-inputs/node.zip"       "${PINS[0]}"
          curl -fsSL -o "$RUNNER_TEMP/win-inputs/postgresql.zip" "${PINS[2]}"
          echo "${PINS[1]}  $RUNNER_TEMP/win-inputs/node.zip"       | sha256sum -c -
          echo "${PINS[3]}  $RUNNER_TEMP/win-inputs/postgresql.zip" | sha256sum -c -

      # ── The signer, pinned the same way ────────────────────────────────────────────
      - name: Install ssign (Certum SimplySign client)
        if: ${{ inputs.sign != 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          SSIGN_URL="https://github.com/Le-Syl21/ssign/releases/download/v0.1.11/ssign-linux-x86_64.tar.gz"
          SSIGN_SHA256="54f49ed781fe9284d0f704faf1ca28175f21ea19881abc3fae62437146edc18f"
          mkdir -p "$RUNNER_TEMP/ssign"
          curl -fsSL -o "$RUNNER_TEMP/ssign/ssign.tar.gz" "$SSIGN_URL"
          echo "${SSIGN_SHA256}  $RUNNER_TEMP/ssign/ssign.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/ssign/ssign.tar.gz" -C "$RUNNER_TEMP/ssign"
          install -m755 "$RUNNER_TEMP/ssign/ssign" /usr/local/bin/ssign
          ssign --version

      - name: Build and sign the installer
        shell: bash
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          NODE_WINDOWS_ZIP: ${{ runner.temp }}/win-inputs/node.zip
          PG_WINDOWS_ZIP: ${{ runner.temp }}/win-inputs/postgresql.zip
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
          SIGN: ${{ inputs.sign }}
        run: |
          set -euo pipefail
          version="${VERSION#listing-node-v}"
          version="${version#v}"
          node -e '
            const fs = require("fs");
            const p = "Validator/package.json";
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");
          '

          # `ssign` reads CERTUM_EMAIL and CERTUM_OTP from the environment. Both the
          # installer and the embedded uninstaller are signed in one run: ssign caches
          # its session for 20 minutes, so Certum is asked for one code, not two.
          SIGN_ARG=()
          if [ "${SIGN:-true}" != "false" ]; then
            SIGN_ARG=(
              --sign-command 'ssign -n "OmniBazaar Listing Node" -u https://omnibazaar.com'
              --uninst-sign-command 'ssign -n "OmniBazaar Listing Node" -u https://omnibazaar.com "%1"'
              --verify-signature
            )
          fi

          node Installers/listing-node/build-artifacts.mjs \
            --validator Validator \
            --out "$RUNNER_TEMP/artifacts" \
            --version "$version" \
            --platforms windows \
            "${SIGN_ARG[@]}"

      # A signature changes the bytes, so the hash of what will be published is the hash
      # of the signed file, recomputed here.
      - name: Record the SHA-256 of what will be published
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/artifacts"
          sha256sum omnibazaar-listing-node-*-win-x64-setup.exe | tee SHA256SUMS
          file=$(ls omnibazaar-listing-node-*-win-x64-setup.exe)
          {
            echo "## Listing node installer"
            cat SHA256SUMS
            echo ""
            if [ "${SIGN:-true}" != "false" ]; then
              osslsigncode verify -in "$file" | sed -n '1,12p'
            else
              echo "UNSIGNED build — signing was disabled for this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SIGN: ${{ inputs.sign }}

      - uses: actions/upload-artifact@v4
        with:
          name: listing-node-windows-installer
          path: |
            ${{ runner.temp }}/artifacts/omnibazaar-listing-node-*-win-x64-setup.exe
            ${{ runner.temp }}/artifacts/SHA256SUMS
            ${{ runner.temp }}/artifacts/listing-node-artifacts.json
          if-no-files-found: error
          retention-days: 30
