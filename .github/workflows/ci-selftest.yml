name: CI self-test

# Cheap, manual sanity check that the OBZ_CHECKOUT_TOKEN repo secret can read the
# sibling repos the release workspace-reconstruction needs (Validator, WebApp,
# Packages). No build, no publish — just the cross-repo checkouts. Run it from the
# Actions tab (or `gh workflow run ci-selftest.yml`) after rotating the token.

on:
  workflow_dispatch:

jobs:
  checkout-siblings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Validator
        uses: actions/checkout@v4
        with:
          repository: OmniBazaar/Validator
          path: Validator
          token: ${{ secrets.OBZ_CHECKOUT_TOKEN }}
      - name: Checkout WebApp
        uses: actions/checkout@v4
        with:
          repository: OmniBazaar/WebApp
          path: WebApp
          token: ${{ secrets.OBZ_CHECKOUT_TOKEN }}
      - name: Checkout Packages
        uses: actions/checkout@v4
        with:
          repository: OmniBazaar/Packages
          path: packages
          token: ${{ secrets.OBZ_CHECKOUT_TOKEN }}
      - name: Confirm
        run: |
          echo "OBZ_CHECKOUT_TOKEN can read all three sibling repos:"
          ls -d Validator WebApp packages
