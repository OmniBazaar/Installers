name: recon-19781b
# temp read-only recon: listing-postgres schema/other DBs + two-state password + write-capability (rollback only)
on:
  push:
    branches: ["recon-*"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: [self-hosted, wine]
    timeout-minutes: 15
    steps:
      - name: read-only listing-postgres deep read
        shell: bash
        run: |
          set +e
          C=obz-listing-postgres
          P=listingnode
          echo "##A-columns-listing_node"
          sudo -n docker exec -e PGPASSWORD=$P $C psql -U omnibazaar_node -d listing_node -c "select table_name, ordinal_position, column_name, data_type, is_nullable, column_default from information_schema.columns where table_schema='public' order by table_name, ordinal_position;" 2>&1
          echo "##B-constraints-indexes"
          sudo -n docker exec -e PGPASSWORD=$P $C psql -U omnibazaar_node -d listing_node -c "select indexname, indexdef from pg_indexes where schemaname='public';" 2>&1
          sudo -n docker exec -e PGPASSWORD=$P $C psql -U omnibazaar_node -d listing_node -c "select conname, pg_get_constraintdef(oid) from pg_constraint where connamespace='public'::regnamespace;" 2>&1
          echo "##C-second-db-listing_node_lin"
          sudo -n docker exec -e PGPASSWORD=$P $C psql -U omnibazaar_node -d listing_node_lin -c "select table_schema, table_name from information_schema.tables where table_schema not in ('pg_catalog','information_schema') order by 1,2;" 2>&1 | head -80
          sudo -n docker exec -e PGPASSWORD=$P $C psql -U omnibazaar_node -d listing_node_lin -c "select relname, n_live_tup from pg_stat_user_tables order by n_live_tup desc limit 30;" 2>&1
          echo "-- columns in listing_node_lin public --"
          sudo -n docker exec -e PGPASSWORD=$P $C psql -U omnibazaar_node -d listing_node_lin -c "select table_name, column_name, data_type from information_schema.columns where table_schema='public' order by table_name, ordinal_position;" 2>&1 | head -100
          echo "##D-all-db-sizes"
          sudo -n docker exec -e PGPASSWORD=$P $C psql -U omnibazaar_node -d postgres -tAc "select datname, pg_size_pretty(pg_database_size(datname)) from pg_database order by 1;" 2>&1
          echo "##E-two-state-wrong-password"
          sudo -n docker exec -e PGPASSWORD=zz-wrong-19781 $C psql -U omnibazaar_node -d listing_node -tAc "select 1;" 2>&1 | head -3
          echo "##F-active-clients"
          sudo -n docker exec -e PGPASSWORD=$P $C psql -U omnibazaar_node -d postgres -c "select datname, usename, client_addr, application_name, state, query_start from pg_stat_activity where pid <> pg_backend_pid();" 2>&1
          echo "##G-listing-node-app-presence"
          sudo -n ss -ltnp 2>/dev/null | grep -E ':3200|:3210|:3211|:3220|:3103' || echo "no listing ports listening"
          sudo -n systemctl list-unit-files 2>/dev/null | grep -iE 'listing|omni' | head -20
          sudo -n find / -maxdepth 6 -name "*listing*node*.service" 2>/dev/null | head -10
          echo "##H-where-listingnode-pw-appears"
          sudo -n grep -rIl "listingnode" /etc /opt /home/omnirick 2>/dev/null | grep -v node_modules | head -20
          echo "##I-write-capability-rollback-only"
          sudo -n docker exec -e PGPASSWORD=$P $C psql -U omnibazaar_node -d listing_node -v ON_ERROR_STOP=0 <<'SQL' 2>&1
          \echo == rollback-scoped write probe (no permanent change)
          begin;
          insert into public.node_replica_state default values;
          select count(*) as rows_after_insert from public.node_replica_state;
          rollback;
          select count(*) as rows_after_rollback from public.node_replica_state;
          SQL
          echo "##J-table-owner-and-acl"
          sudo -n docker exec -e PGPASSWORD=$P $C psql -U omnibazaar_node -d listing_node -c "select c.relname, pg_get_userbyid(c.relowner) as owner, c.relacl from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r';" 2>&1
          echo "##DONE"
      - name: cleanup temp branch (self-delete)
        if: always()
        shell: bash
        env:
          TOK: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          git push "https://x-access-token:${TOK}@github.com/${GITHUB_REPOSITORY}.git" --delete "${GITHUB_REF_NAME}" 2>&1 || echo "cleanup-failed"
