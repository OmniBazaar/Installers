name: recon-19382-v1
on:
  push:
    branches: ["recon-*"]
permissions:
  contents: read
jobs:
  probe1:
    runs-on: [self-hosted, wine]
    timeout-minutes: 8
    steps:
      - name: read-only mailbox ism collateral state probe
        run: |
          set -x
          RPC=http://65.108.205.116:9650/ext/bc/B5gLCyeRWScxf1CeGHfXjEkcp5au8dQYQjtSV6cRammsLjsbK/rpc
          W=$(mktemp -d)
          echo "" | base64 -d > "$W/b.json"
          wc -c "$W/b.json"
          echo "=== eth_chainId positive control ==="
          curl -sS -m 15 -X POST "$RPC" -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'
          echo
          echo "=== batch eth_call ==="
          curl -sS -m 40 -X POST "$RPC" -H 'Content-Type: application/json' --data-binary @"$W/b.json" -o "$W/o.json" -w 'HTTP=%{http_code} bytes=%{size_download}\n'
          python3 - "$W/o.json" <<'EOF'
import json,sys
d=json.load(open(sys.argv[1]))
if isinstance(d,dict): d=[d]
for r in d:
    print(r.get('id'), '=>', json.dumps(r.get('result', r.get('error'))))
EOF
