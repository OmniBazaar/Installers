name: recon-i19449
on:
  push:
    branches: ["recon-i19449-*"]
permissions:
  contents: read
jobs:
  claim:
    runs-on: [self-hosted, wine]
    timeout-minutes: 12
    steps:
      - name: legacy claim eth_call probe
        run: |
          set -x
          mkdir -p /tmp/i19449 && cd /tmp/i19449
          echo '' | base64 -d > claim_probe.py
          python3 -c "import hashlib;print(hashlib.sha256(open('/tmp/i19449/claim_probe.py','rb').read()).hexdigest())"
          python3 claim_probe.py 2>&1 | tail -n 400
