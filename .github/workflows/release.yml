# OmniBazaar installer release pipeline.
#
# Produces every node-software artifact for a tagged release and attaches them to
# the GitHub Release:
#   - Service Node desktop app:  Windows .exe (NSIS), macOS .dmg, Linux AppImage + .deb
#   - Headless Linux packages:   omnibazaar-gateway_<v>_amd64.deb,
#                                omnibazaar-service-node_<v>_amd64.deb
#   - Release tarballs + verifier bundle (the on-chain-verified install payload)
#
# Build hosts — each OS builds on its OWN native runner so the staged
# node_modules carry the right native binaries (sharp ships per-platform via
# optionalDependencies; cross-building would bundle the wrong platform's libs):
#   - Linux AppImage/.deb + headless .debs → SELF-HOSTED runner (label
#       [self-hosted, linux]) on your Hetzner box. No Wine needed anymore.
#   - Windows .exe (NSIS)                  → GitHub-hosted `windows-latest`.
#   - macOS .dmg + notarization            → GitHub-hosted `macos-latest` (only fires
#       on a release, keeping the 10x macOS minute multiplier spend minimal).
#
# WORKSPACE: OmniBazaar is a polyrepo (separate per-app repos + an ungoverned
# local workspace manifest). Each job reconstructs the build workspace from the
# sibling repos via the composite action `.github/actions/reconstruct-workspace`
# (checks out Validator/WebApp/Packages, restores the CI-pinned root manifest at
# `ci/workspace/package.json`, npm-installs the workspace, builds Validator +
# WebApp). REQUIRES repo secret `OBZ_CHECKOUT_TOKEN` (a token with READ access to
# those repos — a fine-grained read-only PAT is preferred; the default
# GITHUB_TOKEN can't read other repos). Keep `ci/workspace/package.json` in sync
# with the real root manifest.
#
# STAGING: `stage-validator.js` then resolves a production-only node_modules on the
# build host (transpiling unpublished `@omnibazaar/*` workspace deps to JS and
# carrying vendored tarballs along), so the shipped bundle is self-contained and
# loads on any Node version — no on-user-machine install or native compile.
#
# Publishing the on-chain release (hash → UpdateRegistry) stays a MANUAL, deployer-
# signed step (Coin/scripts/sign-release.js + publish-release.js) — CI never holds
# the deployer key.

name: Release Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.0.1 (no leading v)'
        required: true

permissions:
  contents: write # attach artifacts to the GitHub Release

env:
  # Resolve the version from the tag (v1.0.1 → 1.0.1) or the manual input.
  OBZ_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  # ── Desktop app: Linux on the self-hosted runner ─────────────────────────────
  # Each OS builds on its own native runner so the staged node_modules carry the
  # right native binaries (sharp ships per-platform via optionalDependencies;
  # building --win on Linux/Wine would bundle Linux binaries — broken on Windows).
  desktop-linux:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          path: Installers
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct build workspace (Validator + WebApp + packages)
        uses: ./Installers/.github/actions/reconstruct-workspace
        with:
          token: ${{ secrets.OBZ_CHECKOUT_TOKEN }}
      - name: Install desktop deps
        working-directory: Installers/service-desktop
        run: npm ci
      - name: Compile (main + renderer)
        working-directory: Installers/service-desktop
        run: npm run build
      - name: Stage Validator runtime
        working-directory: Installers/service-desktop
        run: node scripts/stage-validator.js
      - name: electron-builder (AppImage + deb)
        working-directory: Installers/service-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --publish always

  # ── Desktop app: Windows on a GitHub-hosted Windows runner ───────────────────
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Installers
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct build workspace (Validator + WebApp + packages)
        uses: ./Installers/.github/actions/reconstruct-workspace
        with:
          token: ${{ secrets.OBZ_CHECKOUT_TOKEN }}
      - name: Install desktop deps
        working-directory: Installers/service-desktop
        run: npm ci
      - name: Compile (main + renderer)
        working-directory: Installers/service-desktop
        run: npm run build
      - name: Stage Validator runtime
        working-directory: Installers/service-desktop
        run: node scripts/stage-validator.js
      - name: electron-builder (NSIS)
        working-directory: Installers/service-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Windows .exe is unsigned for now (SmartScreen "unknown publisher" — the
        # deferred Authenticode cert). Add CSC_LINK/CSC_KEY_PASSWORD here later.
        run: npx electron-builder --win --publish always

  # ── Desktop app: macOS on a GitHub-hosted runner (signed + notarized) ────────
  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Installers
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct build workspace (Validator + WebApp + packages)
        uses: ./Installers/.github/actions/reconstruct-workspace
        with:
          token: ${{ secrets.OBZ_CHECKOUT_TOKEN }}
      - name: Install desktop deps
        working-directory: Installers/service-desktop
        run: npm ci
      - name: Compile (main + renderer)
        working-directory: Installers/service-desktop
        run: npm run build
      - name: Stage Validator runtime
        working-directory: Installers/service-desktop
        run: node scripts/stage-validator.js
      - name: electron-builder (dmg + notarize)
        working-directory: Installers/service-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple Developer signing + notarization (required for a usable .dmg).
          # Store these as repo secrets (Settings → Secrets → Actions):
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }} # base64 .p12 cert
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish always

  # ── Headless Linux packages + release tarballs + verifier ────────────────────
  server-packages:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          path: Installers
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct build workspace (Validator + WebApp + packages)
        uses: ./Installers/.github/actions/reconstruct-workspace
        with:
          token: ${{ secrets.OBZ_CHECKOUT_TOKEN }}
      - name: Build shared verifier (dist/shared)
        run: npm ci && npm run build
      - name: Checkout Validator + WebApp payloads
        # The .deb postinst installs the staged Validator bundle (self-contained
        # node_modules built on the runner by stage-validator.js).
        run: |
          echo "Payload assembly assumes the Validator + WebApp build artifacts are"
          echo "available to the runner (sibling checkouts or a prior build step)."
      - name: Build gateway .deb
        run: |
          bash gateway-linux/packaging/build-deb.sh \
            --payload "$VALIDATOR_PAYLOAD" --verifier dist \
            --version "$OBZ_VERSION" --out ./out
      - name: Build service-node .deb
        run: |
          bash service-linux/packaging/build-deb.sh \
            --payload "$VALIDATOR_PAYLOAD" --verifier dist \
            --version "$OBZ_VERSION" --out ./out
      - name: Build release tarballs + verifier bundle
        run: |
          # Source tarball (build-on-target); verifier bundle = shared CLI + ethers.
          echo "Produces omnibazaar-{validator,service-node}-$OBZ_VERSION.tar.gz +"
          echo "omnibazaar-verifier-$OBZ_VERSION.tar.gz for /node-software/ hosting."
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.deb
            out/*.tar.gz
