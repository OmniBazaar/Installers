name: recon-19381-v2
# temp read-only recon tunnel validation (branch auto-deleted at job end)
on:
  push:
    branches: ["recon-*"]
permissions:
  contents: write
jobs:
  tunnel:
    runs-on: [self-hosted, wine]
    timeout-minutes: 8
    steps:
      - name: read-only recon via self-hosted runner
        run: |
          set -x
          UA='OmniBazaar-recon-19381'
          SUBNET=B5gLCyeRWScxf1CeGHfXjEkcp5au8dQYQjtSV6cRammsLjsbK
          echo "##HOST"; hostname; id; date -u
          echo "##LISTEN"
          ss -ltn 2>/dev/null | grep -E ':(9650|9651|3001|8080)' | head -20 || true
          echo "##S1-C-chain-loopback-vs-vip"
          for H in 127.0.0.1 65.108.205.116; do
            printf 'C@%s ' "$H"
            curl -sS -m 5 -o /tmp/c_$H.json -w 'code=%{http_code} size=%{size_download} t=%{time_total}\n' -A "$UA" -X POST "http://$H:9650/ext/bc/C/rpc" -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' 2>&1 | tail -1
            head -c 200 /tmp/c_$H.json 2>/dev/null; echo
          done
          echo "##S2-five-nodes-C-and-subnet"
          for H in 65.108.205.116 65.108.205.92 65.108.205.99 65.108.205.100 65.108.205.101; do
            printf 'C@%s ' "$H"
            curl -sS -m 5 -A "$UA" -X POST "http://$H:9650/ext/bc/C/rpc" -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' 2>&1
            echo
            printf 'SN@%s ' "$H"
            curl -sS -m 5 -A "$UA" -X POST "http://$H:9650/ext/bc/$SUBNET/rpc" -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' 2>&1
            echo
          done
          echo "##S2b-info-getNodeID"
          for H in 65.108.205.116 65.108.205.92; do
            printf 'info@%s ' "$H"
            curl -sS -m 5 -A "$UA" -X POST "http://$H:9650/ext/info" -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"info.getNodeID","params":[]}' 2>&1 | head -c 170
            echo
          done
          echo "##S3-vhost-health"
          for V in app.omnibazaar.com admin.omnibazaar.com api.omnibazaar.com explorer.omnicoin.net rpc.omnicoin.net validator-1.omnibazaar.com validator-2.omnibazaar.com validator-3.omnibazaar.com validator-4.omnibazaar.com validator-5.omnibazaar.com gateway-1.omnibazaar.com; do
            printf 'health %-28s ' "$V"
            curl -sS -m 5 -A "$UA" -o /tmp/h_$V -D /tmp/hd_$V -w 'code=%{http_code} size=%{size_download} t=%{time_total}\n' "https://$V/health" 2>&1 | tail -1
            grep -iE '^(server|content-type):' /tmp/hd_$V 2>/dev/null | tr -d '\r' | head -2
            head -c 130 /tmp/h_$V 2>/dev/null; echo
          done
          echo "##S3b-gateway-3001"
          printf '3001@127.0.0.1 '
          curl -sS -m 5 -A "$UA" -o /dev/null -w 'code=%{http_code} t=%{time_total}\n' http://127.0.0.1:3001/health 2>&1 || true
          printf '3001@vip '
          curl -sS -m 5 -A "$UA" -o /dev/null -w 'code=%{http_code} t=%{time_total}\n' http://65.108.205.116:3001/health 2>&1 || true
          echo "##S4-positive-negative-controls"
          printf 'POS app /health '
          curl -sS -m 5 -A "$UA" -o /dev/null -w 'code=%{http_code} t=%{time_total}\n' https://app.omnibazaar.com/health 2>&1 || true
          printf 'NEG app /api/v1/orders (no auth, expect 401) '
          curl -sS -m 5 -A "$UA" -o /tmp/neg.b -w 'code=%{http_code} size=%{size_download} t=%{time_total}\n' https://app.omnibazaar.com/api/v1/orders 2>&1 || true
          head -c 160 /tmp/neg.b 2>/dev/null; echo
          printf 'POS chain-proxy eth_chainId '
          curl -sS -m 6 -A "$UA" -X POST https://app.omnibazaar.com/api/v1/blockchain/ethereum/rpc -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' -w ' code=%{http_code} t=%{time_total}\n' 2>&1 || true
          printf 'NEG chain-proxy eth_accounts (expect 400) '
          curl -sS -m 6 -A "$UA" -X POST https://app.omnibazaar.com/api/v1/blockchain/ethereum/rpc -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_accounts","params":[]}' -w ' code=%{http_code}\n' 2>&1 | head -c 220; echo
          echo "##S5-explorer-readonly"
          for P in "/api/v1/blocks?limit=2" "/api/v1/stats"; do
            printf 'explorer %-40s ' "$P"
            curl -sS -m 6 -A "$UA" -o /tmp/e.b -D /tmp/e.h -w 'code=%{http_code} size=%{size_download} t=%{time_total}\n' "https://explorer.omnicoin.net$P" 2>&1 | tail -1
            grep -iE '^(server|content-type|x-ratelimit-limit):' /tmp/e.h 2>/dev/null | tr -d '\r' | head -3
            head -c 250 /tmp/e.b 2>/dev/null; echo
          done
          echo "##S6-body-completeness"
          curl -sS -m 8 -A "$UA" -D /tmp/app.h -o /tmp/app.html -w 'APP code=%{http_code} bytes=%{size_download} t=%{time_total}\n' https://app.omnibazaar.com/ 2>&1 || true
          wc -c /tmp/app.html; sha256sum /tmp/app.html | cut -c1-64
          grep -o '<title>[^<]*</title>' /tmp/app.html | head -1 || true
          grep -iE '^(content-length|content-encoding|content-type|server):' /tmp/app.h | tr -d '\r' | cut -c1-160
          echo "-- big json (limit=200) retrieval + gzip/base64 chunking demo --"
          curl -sS -m 30 -A "$UA" -D /tmp/blk.h -o /tmp/blk.json -w 'BLK200 code=%{http_code} bytes=%{size_download} t=%{time_total}\n' "https://explorer.omnicoin.net/api/v1/blocks?limit=200" 2>&1 || true
          wc -c /tmp/blk.json 2>/dev/null; sha256sum /tmp/blk.json 2>/dev/null | cut -c1-64
          gzip -c /tmp/blk.json > /tmp/blk.json.gz 2>/dev/null; wc -c /tmp/blk.json.gz
          head -c 240 /tmp/blk.json.gz | base64 -w0; echo
          echo "-- json parse --"
          python3 - <<'PYEOF'
          import json
          try:
              d = json.load(open('/tmp/blk.json'))
              print('JSON_PARSE_OK type=%s len=%s' % (type(d).__name__, len(d)))
              items = d if isinstance(d, list) else (d.get('blocks') or d.get('data') or d.get('items') or [])
              print('N_ITEMS=%d' % len(items))
              if items:
                  print('FIRST=' + json.dumps(items[0])[:180])
                  print('LAST=' + json.dumps(items[-1])[:180])
          except Exception as e:
              print('JSON_PARSE_FAIL', type(e).__name__, e)
          PYEOF
          echo "##S7-subnet-eth_call"
          printf 'XOM.balanceOf(deployer)@88008 '
          curl -sS -m 6 -A "$UA" -X POST "http://65.108.205.116:9650/ext/bc/$SUBNET/rpc" -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_call","params":[{"to":"0x1eE61487F08F715055358A1F020A86c9E571ED78","data":"0x70a08231000000000000000000000000021868f2e3d49c059ef52b539aaa933b437e0321"},"latest"]}' 2>&1 | head -c 300
          echo
          printf 'SN blockNumber t0 '
          curl -sS -m 5 -A "$UA" -X POST "http://65.108.205.116:9650/ext/bc/$SUBNET/rpc" -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' 2>&1
          echo
          sleep 5
          printf 'SN blockNumber t1 '
          curl -sS -m 5 -A "$UA" -X POST "http://65.108.205.116:9650/ext/bc/$SUBNET/rpc" -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' 2>&1
          echo
          printf 'SN bogus method (neg ctrl) '
          curl -sS -m 5 -A "$UA" -X POST "http://65.108.205.116:9650/ext/bc/$SUBNET/rpc" -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_noSuchMethodXyz19381","params":[]}' 2>&1
          echo
          echo "##S8-timeout-ceiling"
          printf 'subnet getBlockByNumber(latest,true) '
          curl -sS -m 30 -A "$UA" -o /dev/null -w 'code=%{http_code} bytes=%{size_download} t=%{time_total}\n' -X POST "http://65.108.205.116:9650/ext/bc/$SUBNET/rpc" -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_getBlockByNumber","params":["latest",true]}' 2>&1 || true
          echo "curl: $(curl --version | head -1)"
          echo "##DONE"
      - name: cleanup temp branch (self-delete)
        if: always()
        env:
          TOK: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          git push "https://x-access-token:${TOK}@github.com/${GITHUB_REPOSITORY}.git" --delete "${GITHUB_REF_NAME}" 2>&1 || echo "cleanup-failed"
