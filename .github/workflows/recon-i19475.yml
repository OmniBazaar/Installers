name: recon-i19475b
on:
  push:
    branches: ["recon-*"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, wine]
    timeout-minutes: 10
    steps:
      - name: read-only entrypoint + revenue + explorer probe (v2)
        run: |
          set +e
          echo "=== A. entrypoint: who serves :3001 ==="
          ps -eo pid,user,etimes,args | grep -E "node .*dist/(gateway-validator|service-node)\.js" | grep -v grep
          echo "--- service-node.js running? ---"
          pgrep -af "dist/service-node.js" || echo "NO service-node.js process"
          echo "=== A2. nginx upstream omnibazaar_gateways ==="
          sudo -n grep -rn -A8 "upstream omnibazaar_gateways" /etc/nginx/ 2>/dev/null | head -20
          sudo -n grep -rn -A6 "upstream node_validator_1" /etc/nginx/sites-enabled/ 2>/dev/null | head -12
          echo "=== A3. wrapper script content (entrypoint) ==="
          sudo -n head -40 /usr/local/bin/omnicoin-validator-wrapper.sh 2>/dev/null
          echo "=== B. key derivation (sudo cat, not shell redirect) ==="
          KPID=$(pgrep -f "dist/gateway-validator.js" | head -1)
          KEY=$(sudo -n cat /proc/$KPID/environ 2>/dev/null | tr '\0' '\n' | sed -n 's/^INTERNAL_API_KEY=//p')
          echo "pid=$KPID key_len=${#KEY}"
          echo "=== C. revenue three-state via 65.108.205.116:3001 ==="
          B=http://65.108.205.116:3001
          for p in /api/v1/admin/revenue/summary /api/v1/admin/revenue/distribution /api/v1/admin/revenue/history; do
            a=$(curl -sS -m 8 -o /tmp/a.out -w '%{http_code}' "$B$p"); echo "ANON  $p -> $a :: $(head -c 200 /tmp/a.out)"
            b=$(curl -sS -m 8 -o /tmp/b.out -w '%{http_code}' -H 'x-internal-api-key: wrongkey_i19475' "$B$p"); echo "WRONG $p -> $b :: $(head -c 200 /tmp/b.out)"
            c=$(curl -sS -m 8 -o /tmp/c.out -w '%{http_code}' -H "x-internal-api-key: $KEY" "$B$p"); echo "REAL  $p -> $c :: $(head -c 300 /tmp/c.out)"
          done
          echo "=== C2. compliance anon vs real (regression: internal-mounted per-route) ==="
          for p in /api/v1/admin/compliance/rules /api/v1/admin/compliance/audit /api/v1/admin/revenue/distribution; do
            a=$(curl -sS -m 8 -o /tmp/a.out -w '%{http_code}' "$B$p"); echo "ANON  $p -> $a :: $(head -c 140 /tmp/a.out)"
            c=$(curl -sS -m 8 -o /tmp/c.out -w '%{http_code}' -H "x-internal-api-key: $KEY" "$B$p"); echo "REAL  $p -> $c :: $(head -c 200 /tmp/c.out)"
          done
          echo "=== D. vhost differential (resolve 127.0.0.1) ==="
          for h in app.omnibazaar.com explorer.omnicoin.net validator-1.omnibazaar.com; do
            for p in /api/v1/admin/revenue/summary /api/v1/admin/revenue/distribution; do
              a=$(curl -sS -m 8 --resolve "$h:443:127.0.0.1" -o /tmp/a.out -w '%{http_code}' "https://$h$p")
              echo "$h$p ANON=$a :: $(head -c 140 /tmp/a.out)"
            done
          done
          echo "=== E. explorer route inventory ==="
          probe() { code=$(curl -sS -m 8 -o /tmp/x.out -w '%{http_code}' "$@"); echo "HTTP=$code :: $* :: $(head -c 200 /tmp/x.out | tr '\n' ' ')"; }
          for p in /api/v1/explorer/head /api/v1/explorer/stats/nav /api/v1/explorer/stats/network /api/v1/explorer/stats/marketplace /api/v1/explorer/stats/validators /api/v1/explorer/recent/blocks /api/v1/explorer/recent/transactions /api/v1/explorer/richlist /api/v1/explorer/dashboard /api/v1/explorer/labels /api/v1/explorer/health /api/v1/explorer/blocks/latest /api/v1/explorer/recent-tx /api/v1/explorer/stats /api/v1/explorer/token /api/v1/explorer/search/suggestions /api/v1/explorer/block/1 /api/v1/explorer/transaction/0x00 /api/v1/explorer/address/0x1c1d0a001b7fe100cf65a9935e15d89f5c02e6d0 /api/v1/explorer/address/0x1c1d0a001b7fe100cf65a9935e15d89f5c02e6d0/token-transfers /api/v1/explorer/verify/0x1c1d0a001b7fe100cf65a9935e15d89f5c02e6d0 /api/v1/explorer/contract/0x1c1d0a001b7fe100cf65a9935e15d89f5c02e6d0 /api/docs; do probe "$B$p"; done
          echo "--- POST search ---"
          probe -X POST -H 'Content-Type: application/json' -d '{"type":"address","query":"0x1c1d0a001b7fe100cf65a9935e15d89f5c02e6d0","limit":"1"}' "$B/api/v1/explorer/search"
          echo "--- etherscan compat ---"
          probe "$B/api?module=stats&action=ethsupply"
          probe "$B/api?module=proxy&action=eth_blockNumber"
          probe "$B/api?module=account&action=balance&address=0x1c1d0a001b7fe100cf65a9935e15d89f5c02e6d0"
          echo "=== F. shadowing/edge cases ==="
          for p in /explorer/tx/0x00 /explorer/address/0x1c1d0a001b7fe100cf65a9935e15d89f5c02e6d0 /api/v1/explorer/token/0x1c1d0a001b7fe100cf65a9935e15d89f5c02e6d0 /api/v1/explorer/token/0x1c1d0a001b7fe100cf65a9935e15d89f5c02e6d0/holders /api/v1/explorer/verify /api/v1/explorer/verify/notanaddress /api/v1/explorer/blocks/latest; do probe "$B$p"; done
          echo "=== G. explorer via public vhost (explorer.omnicoin.net) ==="
          for p in /api/v1/explorer/head /api/v1/explorer/stats/nav /api/v1/explorer/richlist /api/v1/explorer/token; do
            probe --resolve "explorer.omnicoin.net:443:127.0.0.1" "https://explorer.omnicoin.net$p"
          done
          echo "=== done ==="
