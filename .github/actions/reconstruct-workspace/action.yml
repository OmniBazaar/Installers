name: Reconstruct build workspace
description: >
  Check out the sibling OmniBazaar repos the installer build needs (Validator,
  WebApp, Packages), restore the CI-pinned root workspace manifest, run the npm
  workspace install, and build Validator + WebApp. Assumes the Installers repo is
  already checked out at ./Installers and Node is set up. Leaves the workspace at
  the job root looking like a dev machine's ~/OmniBazaar tree.

inputs:
  token:
    description: Token with read access to the OmniBazaar Validator/WebApp/Packages repos.
    required: true

runs:
  using: composite
  steps:
    - name: Checkout Validator
      uses: actions/checkout@v4
      with:
        repository: OmniBazaar/Validator
        path: Validator
        token: ${{ inputs.token }}
    - name: Checkout WebApp
      uses: actions/checkout@v4
      with:
        repository: OmniBazaar/WebApp
        path: WebApp
        token: ${{ inputs.token }}
    - name: Checkout Packages
      uses: actions/checkout@v4
      with:
        repository: OmniBazaar/Packages
        path: packages
        token: ${{ inputs.token }}
    - name: Checkout Coin (contract artifacts the Validator compiles against)
      uses: actions/checkout@v4
      with:
        repository: OmniBazaar/Coin
        path: Coin
        token: ${{ inputs.token }}
    - name: Restore root workspace manifest
      shell: bash
      run: cp Installers/ci/workspace/package.json package.json
    - name: Install Coin build dependencies
      shell: bash
      working-directory: Coin
      # Coin gitignores its package-lock.json, so there is nothing for `npm ci` to pin to.
      # `--legacy-peer-deps` is required because Coin's dependency tree contains a peer
      # conflict we do not own (`@eth-optimism/contracts` peers ethers ^5 while the project
      # runs ethers 6). It only relaxes peer *validation*; the installed versions are the
      # ones Coin declares, and the compile output is unaffected.
      run: npm install --no-audit --no-fund --legacy-peer-deps
    - name: Compile the contract artifacts
      shell: bash
      working-directory: Coin
      run: npx hardhat compile
    - name: Workspace install (hoist deps, link @omnibazaar/* + vendored tarballs)
      shell: bash
      run: npm install
    - name: Build Validator (tsc -> dist)
      shell: bash
      working-directory: Validator
      run: npm run build
    - name: Build WebApp (vite -> build)
      shell: bash
      working-directory: WebApp
      run: npm run build
